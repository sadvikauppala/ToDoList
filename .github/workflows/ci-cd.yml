name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ========================================================
  # STAGE 1: Continuous Integration (CI - Build & Test)
  # ========================================================
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Install Ant and Ant-Optional (JUnit support)
        run: |
          sudo apt-get update
          sudo apt-get install -y ant ant-optional

      - name: Verify Build Environment
        run: |
          java -version
          javac -version
          ant -version

      - name: Clean and Compile Project
        run: |
          ant -Djava.awt.headless=true clean compile

      - name: Run Automated Unit Tests
        run: |
          ant -Djava.awt.headless=true test

      - name: Build Standalone JAR & Libraries
        run: |
          ant -Djava.awt.headless=true jar

      - name: Generate Javadoc Documentation
        run: |
          ant -Djava.awt.headless=true javadoc

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test/results/
          retention-days: 7

      - name: Upload Build Distribution (JAR & Libs)
        uses: actions/upload-artifact@v4
        with:
          name: ToDoList-Distribution
          path: dist/
          retention-days: 14

      - name: Upload Javadoc HTML
        uses: actions/upload-artifact@v4
        with:
          name: javadoc-html
          path: dist/javadoc/
          retention-days: 7

  # ========================================================
  # STAGE 2: Continuous Delivery & Deployment (CD)
  # Automatically triggers on pushes to master / main
  # ========================================================
  deploy-docs:
    name: Deploy API Docs to GitHub Pages
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Javadoc Artifact
        uses: actions/download-artifact@v4
        with:
          name: javadoc-html
          path: site

      - name: Deploy to GitHub Pages Branch (gh-pages)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages

  deploy-release:
    name: Publish Automated GitHub Release
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Distribution Artifact
        uses: actions/download-artifact@v4
        with:
          name: ToDoList-Distribution
          path: dist

      - name: Bundle Standalone Release Package
        run: |
          mkdir -p release-pkg
          cp -r dist release-pkg/
          cp -r assets release-pkg/ 2>/dev/null || true
          cat << 'EOF' > release-pkg/RUN_INSTRUCTIONS.txt
          =========================================
          ToDoList Desktop Application
          =========================================

          Requirements:
          - Java Runtime Environment (JRE) 8 or newer installed on your system.

          How to Run:
          1. Double-click "dist/ToDoList.jar" (on Windows / macOS with Java installed).
          2. OR run via terminal / command prompt:
              java -jar dist/ToDoList.jar
          EOF
          cd release-pkg
          zip -r ../ToDoList-v1.0.${{ github.run_number }}.zip ./*
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            ## Automated CI/CD Release :rocket:

            This release was automatically built, tested, and published by **GitHub Actions**!

            ### Build Metadata
            - **Commit SHA**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`
            - **Workflow Run**: `#${{ github.run_number }}`
            - **Triggered By**: `@${{ github.actor }}`

            ### Verification Checks Passed
            - [x] Java source code compiled cleanly
            - [x] All 19 JUnit tests executed and passed
            - [x] Executable JAR built with dependencies
            - [x] Javadoc generated and deployed

            ### How to Use
            Download `ToDoList-v1.0.${{ github.run_number }}.zip` below, extract, and run:
            ```bash
            java -jar dist/ToDoList.jar
            ```
          files: |
            ToDoList-v1.0.${{ github.run_number }}.zip
            dist/ToDoList.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
